<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments — Hire A Lawyer</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand"><div class="logo-icon">⚖️</div><span>Hire A <em>Lawyer</em></span></a>
    <div class="navbar-user" style="position:relative">
      <div id="notif-bell" onclick="toggleNotifPanel()" style="position:relative">
        <span style="font-size:1.3rem;cursor:pointer;color:#fff">🔔</span>
        <span class="notif-badge nav-badge" style="position:absolute;top:-6px;right:-6px;display:none"></span>
      </div>
      <div class="user-avatar" onclick="window.location.href='/dashboard'"></div>
      <div id="notif-panel" class="notif-panel"><div style="padding:12px 16px;border-bottom:1px solid var(--border)"><strong>Notifications</strong></div><div id="notif-list"></div></div>
      <button class="btn btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;border:none" onclick="logout()">Logout</button>
    </div>
  </nav>
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">📅 Appointments</h1>
        <p class="page-subtitle">Manage your consultations and meetings</p>
      </div>
      <div id="headerAction"></div>
    </div>

    <!-- Tabs for status filter -->
    <div class="tabs">
      <button class="tab-btn active" onclick="filterByStatus('')">All</button>
      <button class="tab-btn" onclick="filterByStatus('pending')">Pending</button>
      <button class="tab-btn" onclick="filterByStatus('confirmed')">Confirmed</button>
      <button class="tab-btn" onclick="filterByStatus('completed')">Completed</button>
      <button class="tab-btn" onclick="filterByStatus('cancelled')">Cancelled</button>
    </div>

    <div class="card">
      <div id="apptsContainer"><div class="empty-state"><div class="spinner" style="margin:0 auto 12px"></div></div></div>
    </div>
  </main>

  <!-- Book Appointment Modal -->
  <div class="modal-overlay" id="bookModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">📅 Book Appointment</h2>
        <button class="modal-close" onclick="UI.closeModal('bookModal')">✕</button>
      </div>
      <div class="error-message" id="bookError"></div>
      <div class="form-group">
        <label class="form-label">Select Lawyer *</label>
        <select id="bookLawyer" class="form-control">
          <option value="">-- Choose a lawyer --</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Appointment Title *</label>
        <input type="text" id="bookTitle" class="form-control" placeholder="e.g., Initial Consultation">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Date *</label>
          <input type="date" id="bookDate" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Time *</label>
          <input type="time" id="bookTime" class="form-control">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Duration</label>
          <select id="bookDuration" class="form-control">
            <option value="30">30 min</option>
            <option value="60" selected>1 hour</option>
            <option value="90">1.5 hours</option>
            <option value="120">2 hours</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Meeting Type</label>
          <select id="bookMeetingType" class="form-control">
            <option value="in_person">🏢 In Person</option>
            <option value="video_call">📹 Video Call</option>
            <option value="phone_call">📞 Phone Call</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Notes / Description</label>
        <textarea id="bookNotes" class="form-control" rows="3" placeholder="Briefly describe your legal matter..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="UI.closeModal('bookModal')">Cancel</button>
        <button class="btn btn-primary" id="confirmBookBtn" onclick="confirmBooking()">📅 Confirm Booking</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    Auth.requireAuth();
    const user = Auth.getUser();
    let allAppts = [];

    function buildSidebar() {
      document.getElementById('sidebar').innerHTML = `
        <div class="sidebar-section">
          <div class="sidebar-label">Main</div>
          <a href="/dashboard" class="sidebar-item"><span class="icon">🏠</span> Dashboard</a>
          <a href="/lawyers" class="sidebar-item"><span class="icon">⚖️</span> Find Lawyers</a>
          <a href="/cases" class="sidebar-item"><span class="icon">📋</span> My Cases</a>
          <a href="/appointments" class="sidebar-item active"><span class="icon">📅</span> Appointments</a>
          ${user.role === 'admin' ? '<a href="/admin" class="sidebar-item"><span class="icon">🛡️</span> Admin Panel</a>' : ''}
        </div>
        <div class="sidebar-section" style="margin-top:auto">
          <div class="sidebar-item" style="cursor:default"><span class="icon">👤</span><div><div style="font-weight:600;font-size:0.85rem">${user.name}</div><div style="font-size:0.72rem;color:var(--text-muted)">${user.role}</div></div></div>
          <div class="sidebar-item" onclick="logout()" style="cursor:pointer;color:var(--danger)"><span class="icon">🚪</span> Logout</div>
        </div>`;
      document.querySelector('.user-avatar').textContent = UI.avatarInitials(user.name);
    }

    async function loadAppointments() {
      const res = await API.get('/appointments');
      if (!res || !res.ok) { document.getElementById('apptsContainer').innerHTML = UI.emptyState('Failed to load appointments', '😟'); return; }
      allAppts = res.data.data;
      renderAppts(allAppts);
    }

    function renderAppts(appts) {
      if (!appts.length) { document.getElementById('apptsContainer').innerHTML = UI.emptyState('No appointments found', '📅'); return; }
      const meetingIcons = { in_person: '🏢', video_call: '📹', phone_call: '📞' };
      document.getElementById('apptsContainer').innerHTML = `
        <div class="table-container">
          <table>
            <thead><tr>
              <th>Title</th>
              ${user.role !== 'lawyer' ? '<th>Lawyer</th>' : ''}
              ${user.role !== 'client' ? '<th>Client</th>' : ''}
              <th>Date & Time</th><th>Duration</th><th>Type</th><th>Status</th><th>Actions</th>
            </tr></thead>
            <tbody>${appts.map(a => `
              <tr>
                <td><strong style="font-size:0.87rem">${a.title}</strong></td>
                ${user.role !== 'lawyer' ? `<td style="font-size:0.85rem">${a.lawyer_name || '—'}</td>` : ''}
                ${user.role !== 'client' ? `<td style="font-size:0.85rem">${a.client_name || '—'}</td>` : ''}
                <td style="font-size:0.82rem">
                  <strong>${UI.formatDate(a.appointment_date)}</strong><br>
                  <span style="color:var(--text-muted)">${a.appointment_time}</span>
                </td>
                <td style="font-size:0.82rem">${a.duration_minutes} min</td>
                <td style="font-size:1rem">${meetingIcons[a.meeting_type] || '—'}</td>
                <td>${UI.statusBadge(a.status)}</td>
                <td>
                  ${a.status === 'pending' && user.role === 'lawyer' ? `
                    <button class="btn btn-sm btn-success" onclick="updateApptStatus(${a.id},'confirmed')" style="margin-right:4px">✅ Confirm</button>
                    <button class="btn btn-sm btn-danger" onclick="updateApptStatus(${a.id},'cancelled')">✕</button>
                  ` : ''}
                  ${a.status === 'confirmed' && user.role === 'lawyer' ? `
                    <button class="btn btn-sm btn-primary" onclick="updateApptStatus(${a.id},'completed')">Complete</button>
                  ` : ''}
                  ${(a.status === 'pending' || a.status === 'confirmed') && user.role === 'client' ? `
                    <button class="btn btn-sm btn-danger" onclick="updateApptStatus(${a.id},'cancelled')">Cancel</button>
                  ` : ''}
                  ${a.status === 'pending' || a.status === 'confirmed' ? '' : ''}
                </td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }

    function filterByStatus(status) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      const filtered = status ? allAppts.filter(a => a.status === status) : allAppts;
      renderAppts(filtered);
    }

    async function updateApptStatus(id, status) {
      const res = await API.put(`/appointments/${id}/status`, { status });
      if (!res || !res.ok) { Toast.error(res?.data?.message || 'Update failed.'); return; }
      Toast.success(`Appointment ${status}.`);
      loadAppointments();
    }

    async function loadLawyerOptions() {
      const res = await API.get('/lawyers?limit=100');
      if (!res || !res.ok) return;
      const select = document.getElementById('bookLawyer');
      select.innerHTML = '<option value="">-- Choose a lawyer --</option>';
      res.data.data.forEach(l => {
        select.innerHTML += `<option value="${l.id}">${l.name} — ${l.specialization}</option>`;
      });
    }

    async function confirmBooking() {
      const lawyerId = document.getElementById('bookLawyer').value;
      const title = document.getElementById('bookTitle').value.trim();
      const date = document.getElementById('bookDate').value;
      const time = document.getElementById('bookTime').value;
      const duration = document.getElementById('bookDuration').value;
      const meetingType = document.getElementById('bookMeetingType').value;
      const description = document.getElementById('bookNotes').value;
      if (!lawyerId || !title || !date || !time) { UI.showError('#bookError', 'Lawyer, title, date and time are required.'); return; }
      UI.loading('#confirmBookBtn', true, 'Booking...');
      const res = await API.post('/appointments', { lawyer_id: lawyerId, title, appointment_date: date, appointment_time: time, duration_minutes: duration, meeting_type: meetingType, description });
      UI.loading('#confirmBookBtn', false);
      if (!res || !res.ok) { UI.showError('#bookError', res?.data?.message || 'Booking failed.'); return; }
      UI.closeModal('bookModal');
      Toast.success('Appointment booked successfully!');
      loadAppointments();
    }

    // Header actions
    if (user.role === 'client') {
      document.getElementById('headerAction').innerHTML = `
        <button class="btn btn-primary" onclick="loadLawyerOptions();UI.openModal('bookModal')">➕ Book Appointment</button>`;
    }

    // Set minimum date
    const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('bookDate').min = tomorrow.toISOString().split('T')[0];

    buildSidebar();
    loadAppointments();
  </script>
</body>
</html>
