<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Lawyers — Hire A Lawyer</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="navbar-brand"><div class="logo-icon">⚖️</div><span>Hire A <em>Lawyer</em></span></a>
    <div class="navbar-user" id="navbarRight">
      <a href="/login" class="btn btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;border:none">Login</a>
      <a href="/register" class="btn btn-accent btn-sm">Register</a>
    </div>
  </nav>
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">⚖️ Find a Lawyer</h1>
        <p class="page-subtitle">Browse verified legal experts across all practice areas</p>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="form-group">
        <label class="form-label">Search</label>
        <input type="text" id="searchInput" class="form-control" placeholder="Search by name or keyword...">
      </div>
      <div class="form-group">
        <label class="form-label">Specialization</label>
        <select id="specFilter" class="form-control">
          <option value="">All Areas</option>
          <option>Family Law</option>
          <option>Criminal Law</option>
          <option>Corporate Law</option>
          <option>Property Law</option>
          <option>Civil Law</option>
          <option>Labour Law</option>
          <option>Tax Law</option>
          <option>Immigration Law</option>
          <option>Intellectual Property</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Location</label>
        <input type="text" id="locationFilter" class="form-control" placeholder="City or state...">
      </div>
      <button class="btn btn-primary" onclick="loadLawyers()">🔍 Search</button>
      <button class="btn btn-outline" onclick="clearFilters()">Clear</button>
    </div>

    <!-- Lawyers Grid -->
    <div id="lawyersContainer">
      <div class="empty-state"><div class="spinner" style="margin:0 auto"></div><p>Loading lawyers...</p></div>
    </div>

    <!-- Pagination -->
    <div id="pagination" style="display:flex;justify-content:center;gap:8px;margin-top:24px"></div>
  </main>

  <!-- Lawyer Detail Modal -->
  <div class="modal-overlay" id="lawyerModal">
    <div class="modal" style="max-width:620px">
      <div class="modal-header">
        <h2 class="modal-title">Lawyer Profile</h2>
        <button class="modal-close" onclick="UI.closeModal('lawyerModal')">✕</button>
      </div>
      <div id="lawyerModalContent"></div>
    </div>
  </div>

  <!-- Book Appointment Modal -->
  <div class="modal-overlay" id="bookModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">📅 Book Appointment</h2>
        <button class="modal-close" onclick="UI.closeModal('bookModal')">✕</button>
      </div>
      <div class="error-message" id="bookError"></div>
      <input type="hidden" id="bookLawyerId">
      <div class="form-group">
        <label class="form-label">Appointment Title *</label>
        <input type="text" id="bookTitle" class="form-control" placeholder="e.g., Initial Consultation">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Date *</label>
          <input type="date" id="bookDate" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Time *</label>
          <input type="time" id="bookTime" class="form-control">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Duration (minutes)</label>
          <select id="bookDuration" class="form-control">
            <option value="30">30 min</option>
            <option value="60" selected>1 hour</option>
            <option value="90">1.5 hours</option>
            <option value="120">2 hours</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Meeting Type</label>
          <select id="bookMeetingType" class="form-control">
            <option value="in_person">In Person</option>
            <option value="video_call">Video Call</option>
            <option value="phone_call">Phone Call</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea id="bookDescription" class="form-control" rows="3" placeholder="Briefly describe your legal matter..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="UI.closeModal('bookModal')">Cancel</button>
        <button class="btn btn-primary" id="confirmBookBtn" onclick="confirmBooking()">📅 Book Appointment</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let currentPage = 1;
    const LIMIT = 9;

    // Build navbar based on auth state
    function buildNavbar() {
      if (Auth.isLoggedIn()) {
        const user = Auth.getUser();
        document.getElementById('navbarRight').innerHTML = `
          <a href="/dashboard" class="btn btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;border:none">Dashboard</a>
          <div class="user-avatar" style="cursor:pointer" onclick="window.location.href='/dashboard'">${UI.avatarInitials(user.name)}</div>
        `;
        buildSidebar(user);
        document.querySelector('.main-content').style.marginLeft = 'var(--sidebar-width)';
      }
    }

    function buildSidebar(user) {
      document.getElementById('sidebar').innerHTML = `
        <div class="sidebar-section">
          <div class="sidebar-label">Main</div>
          <a href="/dashboard" class="sidebar-item"><span class="icon">🏠</span> Dashboard</a>
          <a href="/lawyers" class="sidebar-item active"><span class="icon">⚖️</span> Find Lawyers</a>
          <a href="/cases" class="sidebar-item"><span class="icon">📋</span> My Cases</a>
          <a href="/appointments" class="sidebar-item"><span class="icon">📅</span> Appointments</a>
        </div>`;
    }

    async function loadLawyers(page = 1) {
      currentPage = page;
      const search = document.getElementById('searchInput').value;
      const spec = document.getElementById('specFilter').value;
      const loc = document.getElementById('locationFilter').value;
      let url = `/lawyers?page=${page}&limit=${LIMIT}`;
      if (search) url += `&search=${encodeURIComponent(search)}`;
      if (spec) url += `&specialization=${encodeURIComponent(spec)}`;
      if (loc) url += `&location=${encodeURIComponent(loc)}`;

      document.getElementById('lawyersContainer').innerHTML = '<div class="empty-state"><div class="spinner" style="margin:0 auto 12px"></div><p>Loading...</p></div>';
      const res = await API.get(url);
      if (!res || !res.ok) { document.getElementById('lawyersContainer').innerHTML = UI.emptyState('Failed to load lawyers', '😟'); return; }
      const { data, total } = res.data;
      if (!data.length) { document.getElementById('lawyersContainer').innerHTML = UI.emptyState('No lawyers found matching your search', '🔍'); return; }

      document.getElementById('lawyersContainer').innerHTML = `
        <p style="font-size:0.82rem;color:var(--text-muted);margin-bottom:12px">${total} lawyers found</p>
        <div class="lawyers-grid">${data.map(l => lawyerCard(l)).join('')}</div>`;

      // Pagination
      const totalPages = Math.ceil(total / LIMIT);
      document.getElementById('pagination').innerHTML = Array.from({ length: totalPages }, (_, i) =>
        `<button class="btn btn-sm ${i + 1 === page ? 'btn-primary' : 'btn-outline'}" onclick="loadLawyers(${i + 1})">${i + 1}</button>`
      ).join('');
    }

    function lawyerCard(l) {
      return `
        <div class="lawyer-card" onclick="viewLawyer(${l.id})">
          <div class="lawyer-avatar">${UI.avatarInitials(l.name)}</div>
          <div class="lawyer-name">${l.name}</div>
          <div class="lawyer-spec">${l.specialization}</div>
          <div class="flex gap-2 mb-2">
            <span class="star-rating">${UI.stars(l.rating)}</span>
            <span style="font-size:0.8rem;color:var(--text-muted)">${l.rating || 0} (${l.total_reviews} reviews)</span>
          </div>
          <div class="lawyer-meta">
            <span>📍 ${l.location || 'N/A'}</span>
            <span>💼 ${l.experience_years} yrs exp</span>
            <span>💰 ₹${l.hourly_rate}/hr</span>
          </div>
          <div style="margin-top:12px;display:flex;gap:8px">
            <span class="badge ${l.availability_status === 'available' ? 'badge-active' : 'badge-pending'}">${l.availability_status}</span>
          </div>
          ${Auth.isLoggedIn() && Auth.getUser().role === 'client' ? `
            <button class="btn btn-primary btn-sm" style="width:100%;margin-top:12px;justify-content:center"
              onclick="event.stopPropagation();openBooking(${l.id}, '${l.name}')">📅 Book Appointment</button>` : ''}
        </div>`;
    }

    async function viewLawyer(id) {
      const res = await API.get(`/lawyers/${id}`);
      if (!res || !res.ok) { Toast.error('Failed to load lawyer profile.'); return; }
      const l = res.data.data;
      document.getElementById('lawyerModalContent').innerHTML = `
        <div style="display:flex;gap:16px;margin-bottom:20px">
          <div class="lawyer-avatar" style="width:80px;height:80px;font-size:2rem;flex-shrink:0">${UI.avatarInitials(l.name)}</div>
          <div>
            <h2 style="font-size:1.2rem;font-weight:700;color:var(--primary)">${l.name}</h2>
            <p style="color:var(--accent-dark);font-weight:600">${l.specialization}</p>
            <div class="flex gap-2 mt-1">
              <span class="star-rating">${UI.stars(l.rating)}</span>
              <span style="font-size:0.82rem;color:var(--text-muted)">${l.rating} (${l.total_reviews} reviews)</span>
            </div>
          </div>
        </div>
        <div class="grid-2" style="gap:12px;margin-bottom:16px">
          <div style="background:var(--bg);padding:12px;border-radius:var(--radius-sm)">
            <p style="font-size:0.75rem;color:var(--text-muted)">Experience</p>
            <p style="font-weight:700">${l.experience_years} Years</p>
          </div>
          <div style="background:var(--bg);padding:12px;border-radius:var(--radius-sm)">
            <p style="font-size:0.75rem;color:var(--text-muted)">Consultation Fee</p>
            <p style="font-weight:700">₹${l.hourly_rate}/hr</p>
          </div>
          <div style="background:var(--bg);padding:12px;border-radius:var(--radius-sm)">
            <p style="font-size:0.75rem;color:var(--text-muted)">Location</p>
            <p style="font-weight:700">${l.location || 'N/A'}</p>
          </div>
          <div style="background:var(--bg);padding:12px;border-radius:var(--radius-sm)">
            <p style="font-size:0.75rem;color:var(--text-muted)">Status</p>
            <span class="badge badge-${l.availability_status === 'available' ? 'active' : 'pending'}">${l.availability_status}</span>
          </div>
        </div>
        <div class="form-group"><p style="font-weight:600;margin-bottom:8px">About</p><p style="font-size:0.87rem;color:var(--text-muted);line-height:1.7">${l.bio || 'No bio available.'}</p></div>
        ${l.reviews && l.reviews.length ? `
          <div><p style="font-weight:600;margin-bottom:12px">Recent Reviews</p>
          ${l.reviews.map(r => `
            <div style="padding:12px;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:8px">
              <div style="display:flex;justify-content:space-between;margin-bottom:4px">
                <strong style="font-size:0.85rem">${r.client_name}</strong>
                <span class="star-rating" style="font-size:0.8rem">${UI.stars(r.rating)}</span>
              </div>
              <p style="font-size:0.82rem;color:var(--text-muted)">${r.comment || ''}</p>
            </div>`).join('')}
          </div>` : ''}
        ${Auth.isLoggedIn() && Auth.getUser().role === 'client' ? `
          <div style="margin-top:16px;text-align:center">
            <button class="btn btn-primary" onclick="UI.closeModal('lawyerModal');openBooking(${l.id},'${l.name}')">📅 Book Appointment with ${l.name.split(' ')[0]}</button>
          </div>` : ''}`;
      UI.openModal('lawyerModal');
    }

    function openBooking(lawyerId, lawyerName) {
      if (!Auth.isLoggedIn()) { Toast.info('Please login to book an appointment.'); setTimeout(() => window.location.href = '/login', 1000); return; }
      if (Auth.getUser().role !== 'client') { Toast.error('Only clients can book appointments.'); return; }
      document.getElementById('bookLawyerId').value = lawyerId;
      const today = new Date(); today.setDate(today.getDate() + 1);
      document.getElementById('bookDate').min = today.toISOString().split('T')[0];
      UI.openModal('bookModal');
    }

    async function confirmBooking() {
      const lawyerId = document.getElementById('bookLawyerId').value;
      const title = document.getElementById('bookTitle').value.trim();
      const date = document.getElementById('bookDate').value;
      const time = document.getElementById('bookTime').value;
      const duration = document.getElementById('bookDuration').value;
      const meetingType = document.getElementById('bookMeetingType').value;
      const description = document.getElementById('bookDescription').value.trim();

      if (!title || !date || !time) { UI.showError('#bookError', 'Title, date and time are required.'); return; }
      UI.hideError('#bookError');
      UI.loading('#confirmBookBtn', true, 'Booking...');
      const res = await API.post('/appointments', { lawyer_id: lawyerId, title, appointment_date: date, appointment_time: time, duration_minutes: duration, meeting_type: meetingType, description });
      UI.loading('#confirmBookBtn', false);
      if (!res || !res.ok) { UI.showError('#bookError', res?.data?.message || 'Booking failed.'); return; }
      UI.closeModal('bookModal');
      Toast.success('Appointment booked successfully!');
    }

    function clearFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('specFilter').value = '';
      document.getElementById('locationFilter').value = '';
      loadLawyers();
    }

    // Search on enter
    document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') loadLawyers(); });

    buildNavbar();
    loadLawyers();
  </script>
</body>
</html>
